<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect — Attendance Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <div>
        <h1 class="brand-title">CampusConnect</h1>
        <p class="subtitle" id="user-greeting">Welcome, Student</p>
      </div>
      <div class="header-actions">
        <button id="notify-btn" class="btn-icon" title="Daily Notification">??</button>
        <button id="profile-btn" class="btn-icon" title="User Profile">??</button>
        <button id="theme-toggle" class="btn-icon" title="Toggle Theme">??</button>
      </div>
    </header>

    <main class="dashboard-grid">
      <!-- Calendar View -->
      <section class="card calendar-card">
        <div class="calendar-header">
          <button id="prev-month-btn" class="btn-month">&lt;</button>
          <h2 id="current-month-label">Calendar</h2>
          <button id="next-month-btn" class="btn-month">&gt;</button>
        </div>

        <div class="calendar-weekdays">
          <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>

        <div id="calendar-days-grid" class="days-grid"></div>
      </section>

      <!-- Dashboard Controls -->
      <section class="card controls-card">
        <div class="selected-date-wrapper">
          <span class="label">Selected Date: </span>
          <span id="selected-date-display" class="date-val">None</span>
        </div>
        
        <div class="action-buttons">
          <button id="btn-mark-present" class="btn btn-present">? Present</button>
          <button id="btn-mark-absent" class="btn btn-absent">? Absent</button>
          <button id="btn-mark-holiday" class="btn btn-holiday">?? Holiday</button>
          <button id="btn-mark-clear" class="btn btn-clear">?? Clear</button>
        </div>

        <div class="stats-container">
          <div class="stat-box main-stat">
            <span class="stat-label">Attendance Rate</span>
            <span id="stat-percentage" class="stat-value">0.0%</span>
            <span id="stat-status-badge" class="stat-badge safe">No Data</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Streak</span>
            <span id="stat-streak" class="stat-value">0 Days</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Attended</span>
            <span id="stat-attended" class="stat-value">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Missed</span>
            <span id="stat-absent" class="stat-value">0</span>
          </div>
        </div>

        <div class="bunk-calculator">
          <h4>Bunk Analysis Engine</h4>
          <p id="bunk-calculator-text">Select calendar dates to compute target thresholds.</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Profile & Login Modal -->
  <div id="user-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Student Profile</h3>
        <button id="close-profile-modal-btn" class="btn-close">&times;</button>
      </div>
      <p class="modal-desc">Login or update your student account credentials.</p>
      
      <form id="user-form">
        <div class="form-group">
          <label for="input-user-name">Full Name</label>
          <input type="text" id="input-user-name" class="text-input" placeholder="e.g. Saleem Dudekula" required>
        </div>
        <div class="form-group">
          <label for="input-user-email">Email Address</label>
          <input type="email" id="input-user-email" class="text-input" placeholder="e.g. saleem@gmail.com" required>
        </div>
        <div class="form-group">
          <label for="input-user-role">Department / Track</label>
          <input type="text" id="input-user-role" class="text-input" placeholder="e.g. Computer Science Engineering">
        </div>

        <div class="modal-actions">
          <button type="button" id="reset-data-btn" class="btn btn-danger">Reset Data</button>
          <button type="submit" class="btn btn-primary">Save & Continue</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
